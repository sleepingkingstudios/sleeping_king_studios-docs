---
plugins:
  - sleeping_king_studios/docs/jekyll/plugins/required
collections:
  classes:
    output: false
  constants:
    output: false
  methods:
    output: false
  modules:
    output: false
  namespaces:
    output: false
defaults:
- scope:
    path: ''
    type: 'pages'
  values:
    encoding: 'utf-8'
    layout: 'page'
    title: 'SleepingKingStudios::Docs'
exclude:
  - /vendor
markdown: kramdown

# Project Configuration
project_metadata:
  description:    Tools for generating a versioned documentation site from YARD docs.
  name:           SleepingKingStudios::Docs
  repository_url: https://github.com/sleepingkingstudios/sleeping_king_studios-docs
  versions:
    - 0.1
    - 0.2

# Theme Configuration
theme: jekyll-theme-dinky
description: |
  Tools for generating a versioned documentation site from YARD docs.
github:
  repository_url: https://github.com/sleepingkingstudios/sleeping_king_studios-docs
title: 'Docs'
